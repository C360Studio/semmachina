name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    # Not cosmetic. GitHub's default for `run:` is `bash -e {0}`, which does NOT
    # set pipefail — so `go test ... | tee log` reports the exit status of tee
    # and a failing suite passes the step. Naming bash explicitly selects
    # `bash --noprofile --norc -eo pipefail {0}`. This is the single most
    # common way a CI gate becomes green without proving anything, and it is
    # fixed here once for every job.
    shell: bash

# NOTE ON WHAT IS DELIBERATELY ABSENT
#
# SEMMACHINA_SKIP_INTEGRATION must never be set anywhere in this file. It is the
# developer escape hatch for a machine without Docker (see
# internal/testinfra.SkipEnv): with it set, every real-infrastructure test skips
# and every package still reports `ok`. A CI run with it set certifies nothing
# while looking identical to one that certified everything. The test job asserts
# its absence at runtime rather than trusting this comment.
#
# No model API keys, endpoints, or credentials are set either. The full turn
# loop runs token-free against internal/mockmodel on loopback, and
# internal/testinfra's TestSuite_NamesNoRemoteEndpoint fails the suite if
# committed source or fixtures name a remote URL, except for the exact URL in
# the inert Gemini live-smoke example — so "no live inference" is checked, not
# merely omitted, while a deliberately manual configuration can still ship.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        # go-version-file rather than a literal: the toolchain CI runs is the
        # one go.mod requires, and cannot drift from it.
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: |
          go vet ./...
          go vet -tags=integration,acceptance,e2e ./...

      - name: gofmt
        # `gofmt -l` REPORTS; `go fmt` rewrites. A gate that fixes the thing it
        # is checking passes on the second run for the wrong reason, and leaves
        # a dirty tree behind for any later step that diffs.
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
          echo "OK: gofmt clean"

      - name: revive version matches the go.mod pin
        # revive is pinned by go.mod's `tool` directive (Go 1.24+) and run via
        # `go tool revive` — no install step, no PATH lookup, and a new revive
        # release cannot introduce warnings until the pin is deliberately
        # bumped. This step catches the one residual drift: a build cache
        # serving a binary built from a different version than go.mod names.
        #
        # (This is also why revive rather than golangci-lint is the linter of
        # record here: golangci-lint has been unrunnable in this project's
        # environment for weeks because the installed binary is built against an
        # older toolchain than the module targets. A lint gate that cannot load
        # the packages is a lint gate that reports nothing.)
        run: bash scripts/check-revive-pin.sh

      - name: revive
        run: bash scripts/run-revive.sh

      - name: Prove the lint gate can fail
        # revive exiting 0 means either "clean" or "examined nothing", and those
        # look identical in a log. This feeds revive known-bad files and
        # requires the expected findings — including proof that the one
        # max-public-structs exclusion is scoped to internal/vocabulary and has
        # not become a global disable.
        run: bash scripts/check-revive-fires.sh

      - name: Prove the zero-skip gate can fail
        # Same discipline for the coverage gate: a matrix of synthetic
        # `go test -json` streams, including the package-with-no-test-files
        # shape that must NOT be a false positive. Fast — no Docker, no build.
        run: bash scripts/check-no-skips_fixture_test.sh

      - name: Prove the test-tier gate can fail
        # The split is safe only while every real-infrastructure source is in
        # exactly one checked tier and no Docker-starting TestMain is untagged.
        run: |
          bash scripts/check-test-tiers_fixture_test.sh
          bash scripts/check-test-tiers.sh
          bash scripts/check-test-union_fixture_test.sh

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build ./...

      - name: Cross-compile linux/amd64
        # Part of the project's stated local gate ("CI green before push: lint,
        # -race tests, cross-compile"). The MVP target is Apple Silicon and the
        # hosted target is the same image on a rented Linux box, so this is the
        # deployment artifact rather than a formality.
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-w -s" \
            -o semmachina-linux-amd64 \
            ./cmd/semmachina

      - name: The binary refuses to start without configuration
        # Not `--version || true`. The binary REQUIRES -config, so running it
        # bare must exit non-zero with a usage message — which proves the
        # artifact links and executes, and that its own precondition is live.
        # A step that swallowed the status would prove only that a file exists.
        run: |
          out="${RUNNER_TEMP}/bare-start.out"
          err="${RUNNER_TEMP}/bare-start.err"
          if ./semmachina-linux-amd64 >"$out" 2>"$err"; then
            echo "FAIL: the binary started with no -config; it is supposed to refuse."
            cat "$out" "$err"
            exit 1
          fi
          if ! grep -qi "config" "$err" "$out"; then
            echo "FAIL: the binary exited non-zero but said nothing about configuration:"
            cat "$out" "$err"
            exit 1
          fi
          echo "OK: cross-compiled binary runs and refuses an unconfigured start"
          cat "$err"

      - name: Upload the linux/amd64 binary
        uses: actions/upload-artifact@v7
        with:
          name: semmachina-linux-amd64
          path: semmachina-linux-amd64
          retention-days: 7

  go_test:
    name: Go test (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [unit, integration, pipeline, recovery, acceptance, e2e]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Docker is required for real-infrastructure lanes
        if: matrix.lane != 'unit'
        run: |
          docker info >/dev/null
          echo "OK: docker daemon reachable"

      - name: Run the checked ${{ matrix.lane }} lane
        # Unit tests run with -race and no Docker. Integration keeps package
        # concurrency at two. Pipeline, recovery, acceptance, and E2E run on
        # isolated hosts with serial package/container lifecycles. The selector,
        # JSON reporter, and no-skip gate are shared with Taskfile.yml.
        run: |
          bash scripts/run-go-test-lane.sh \
            "${{ matrix.lane }}" \
            "${RUNNER_TEMP}/gotest-${{ matrix.lane }}.json"

      - name: Upload the lane's raw test JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gotest-${{ matrix.lane }}-json
          path: ${{ runner.temp }}/gotest-${{ matrix.lane }}.json
          retention-days: 7

  test_union:
    name: Go test union
    runs-on: ubuntu-latest
    needs: [go_test]
    if: always()
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download every lane result
        uses: actions/download-artifact@v7
        with:
          pattern: gotest-*-json
          path: ${{ runner.temp }}/gotest-lanes
          merge-multiple: true

      - name: Prove the split's union is complete and unskipped
        run: |
          bash scripts/check-test-tiers.sh
          bash scripts/check-test-union.sh \
            "${RUNNER_TEMP}/gotest-lanes" \
            "${RUNNER_TEMP}/gotest-union.json"

  spec:
    name: OpenSpec
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Prove the OpenSpec gate uses the exact repository pin
        run: bash scripts/check-openspec_fixture_test.sh

      - name: openspec validate --all --strict
        # --all is load-bearing: `openspec validate --strict` with no target
        # validates nothing and exits 0. The script also asserts the reported
        # item count is non-zero, so a layout move that empties the selection
        # is loud rather than green.
        run: bash scripts/check-openspec.sh

  frontend:
    name: Frontend static and server unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install lockfile dependencies
        run: npm ci

      - name: Frontend lint and type checks
        run: |
          npm run lint
          npm run check

      - name: Frontend server unit tests
        run: npm run test:unit:server

      - name: Frontend build
        run: npm run build

      - name: Surface deployment isolation
        run: node tests/deployment-isolation/run.mjs

  frontend_browser:
    name: Frontend browser components
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install lockfile dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Browser component tests
        run: npm run test:component:browser

  ui_journey:
    name: Playwright UI journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install lockfile dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run deterministic UI journeys
        run: npm run test:journey:ui

      - name: Upload Playwright reports and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-ui-journey
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7

  status-check:
    name: CI Status Check
    runs-on: ubuntu-latest
    needs: [lint, build, go_test, test_union, spec, frontend, frontend_browser, ui_journey]
    if: always()
    steps:
      - name: Every job must have succeeded
        # `if: always()` plus explicit result comparison, rather than relying on
        # needs alone: a needed job that is skipped or cancelled does not fail
        # the workflow by default, so a branch-protection rule pointed at this
        # check would pass on a cancelled test job.
        run: |
          failed=0
          for result in \
            "lint=${{ needs.lint.result }}" \
            "build=${{ needs.build.result }}" \
            "go_test=${{ needs.go_test.result }}" \
            "test_union=${{ needs.test_union.result }}" \
            "spec=${{ needs.spec.result }}" \
            "frontend=${{ needs.frontend.result }}" \
            "frontend_browser=${{ needs.frontend_browser.result }}" \
            "ui_journey=${{ needs.ui_journey.result }}"; do
            echo "$result"
            if [ "${result#*=}" != "success" ]; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more CI jobs did not succeed."
            exit 1
          fi
          echo "All CI jobs passed."
