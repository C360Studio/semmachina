version: '3'

# Load provider credentials from the gitignored local file. An exported value
# wins, so CI and one-off shells do not need to write a file.
dotenv: ['.env']

# The local half of the gate in .github/workflows/ci.yml.
#
# Every check that has any logic lives in scripts/, and both this file and the
# workflow invoke the SAME script — a local gate that reimplements CI is a
# second source of truth, and the two diverge on the day it matters. The one-line
# checks (vet and gofmt) are duplicated as one line each rather than wrapped,
# because a wrapper around `go vet ./...` hides more than it shares. Revive has
# one narrowly scoped generated-fixture exclusion, so its invocation is shared.

tasks:
  default:
    desc: Everything CI runs, in CI's order. Slow — the test task dominates.
    cmds:
      - task: lint
      - task: build
      - task: smoke:surface:isolation:run
      - task: spec
      - task: test

  lint:
    desc: Go and frontend static analysis, formatting, and gate self-checks
    cmds:
      - go vet ./...
      - go vet -tags=integration,acceptance,e2e ./...
      # `gofmt -l` reports; `go fmt` rewrites. A gate that fixes what it checks
      # passes the second time for the wrong reason.
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "not gofmt-clean:"; echo "$unformatted"; exit 1
        fi
        echo "OK: gofmt clean"
      - bash scripts/check-revive-pin.sh
      - bash scripts/run-revive.sh
      - bash scripts/check-revive-fires.sh
      - bash scripts/check-no-skips_fixture_test.sh
      - bash scripts/check-test-tiers_fixture_test.sh
      - bash scripts/check-test-tiers.sh
      - bash scripts/check-test-union_fixture_test.sh
      - task: frontend:lint

  build:
    desc: Build the module and cross-compile the linux/amd64 deployment artifact
    cmds:
      - go build ./...
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-w -s" -o /dev/null ./cmd/semmachina
      - task: frontend:build
      - 'echo "OK: builds and cross-compiles"'

  test:
    desc: |
      Temporary aggregate Go gate plus the frontend suite.

      The Go aggregate intentionally enables every tier while CI transitions to
      independent lanes. It still refuses any skipped test.
    cmds:
      - task: test:all-tags
      - task: frontend:test

  test:unit:
    desc: Docker-free default Go test lane
    vars:
      JSON: '{{.JSON | default ".task-gotest-unit.json"}}'
    cmds:
      - bash scripts/run-go-test-lane.sh unit "{{.JSON}}"

  test:integration:
    desc: Focused real-infrastructure Go component tests
    vars:
      JSON: '{{.JSON | default ".task-gotest-integration.json"}}'
    cmds:
      - bash scripts/run-go-test-lane.sh integration "{{.JSON}}"

  test:pipeline:
    desc: Real rule, graph, and stage pipeline tests, including stage recovery
    vars:
      JSON: '{{.JSON | default ".task-gotest-pipeline.json"}}'
    cmds:
      - bash scripts/run-go-test-lane.sh pipeline "{{.JSON}}"

  test:recovery:
    desc: Real JetStream resume and work-queue recovery tests
    vars:
      JSON: '{{.JSON | default ".task-gotest-recovery.json"}}'
    cmds:
      - bash scripts/run-go-test-lane.sh recovery "{{.JSON}}"

  test:acceptance:
    desc: Real production-composition boot acceptance tests
    vars:
      JSON: '{{.JSON | default ".task-gotest-acceptance.json"}}'
    cmds:
      - bash scripts/run-go-test-lane.sh acceptance "{{.JSON}}"

  test:e2e:
    desc: Real-broker end-to-end turn tests
    vars:
      JSON: '{{.JSON | default ".task-gotest-e2e.json"}}'
    cmds:
      - bash scripts/run-go-test-lane.sh e2e "{{.JSON}}"

  test:all-tags:
    desc: Temporary all-tier zero-skip Go gate during lane migration
    vars:
      JSON: '{{.JSON | default ".task-gotest.json"}}'
    cmds:
      - bash scripts/run-go-test-lane.sh all "{{.JSON}}"

  frontend:install:
    desc: Install the lockfile-pinned SvelteKit dependencies
    cmds:
      - npm ci --prefix web

  frontend:install:browsers:
    desc: Install Chromium for component and browser tests (one-time local setup)
    cmds:
      - npm --prefix web exec -- playwright install chromium

  frontend:lint:
    desc: Check frontend formatting, ESLint, and strict Svelte/TypeScript diagnostics
    cmds:
      - npm --prefix web run lint
      - npm --prefix web run check

  frontend:build:
    desc: Build the SvelteKit surface
    cmds:
      - npm --prefix web run build

  frontend:test:
    desc: Run frontend unit, component, and browser tests
    cmds:
      - npm --prefix web test

  smoke:surface:isolation:
    desc: Deterministic no-provider Docker proof of the surface GraphQL isolation boundary
    cmds:
      - task: frontend:build
      - task: smoke:surface:isolation:run

  smoke:surface:isolation:run:
    internal: true
    cmds:
      - node web/tests/deployment-isolation/run.mjs

  spec:
    desc: openspec validate --all --strict (the --all is load-bearing; without it nothing is validated)
    cmds:
      - bash scripts/check-openspec_fixture_test.sh
      - bash scripts/check-openspec.sh

  tool-versions:
    desc: |
      Print the pinned developer tool versions. They come from go.mod's `tool`
      directive (Go 1.24+) and run via `go tool`, so there is no install step
      and no local-vs-CI drift. Must be run from inside the module.
    cmds:
      - 'echo "pinned tool versions (from the go.mod tool directive):"'
      - go tool revive --version

  run:gemini:
    desc: Run SemMachina with the live Gemini 3.6 Flash instance configuration
    preconditions:
      - sh: test -n "$GEMINI_API_KEY"
        msg: "GEMINI_API_KEY is empty — copy .env.example to .env and fill it in, or export it."
    cmds:
      - go run ./cmd/semmachina -config configs/instance.gemini36-flash.example.json

  smoke:gemini:bellweather:
    desc: |
      Operator-only paid Gemini smoke through Bellweather production boot and WebSocket I/O.
      Runs two bounded provider turn chains: body observation, then an explicit Kit hint request.
    preconditions:
      - sh: test "$SEMMACHINA_PAID_SMOKE" = "1"
        msg: "Paid smoke is disabled — set SEMMACHINA_PAID_SMOKE=1 explicitly."
      - sh: test -n "$GEMINI_API_KEY"
        msg: "GEMINI_API_KEY is empty — copy .env.example to .env and fill it in, or export it."
    cmds:
      - >-
        go run ./cmd/bellweather-smoke
        -config configs/instance.gemini35-flash-lite.bellweather.example.json
        -world fixtures/worlds/bellweather-maze

  smoke:gemini:surface:
    desc: Operator-only paid Gemini acceptance through the real HTTPS browser surface
    preconditions:
      - sh: test "$SEMMACHINA_PAID_SMOKE" = "1"
        msg: "Paid smoke is disabled — set SEMMACHINA_PAID_SMOKE=1 explicitly."
      - sh: test -n "$GEMINI_API_KEY"
        msg: "GEMINI_API_KEY is empty — copy .env.example to .env and fill it in, or export it."
    cmds:
      - exec node web/tests/run-bellweather-surface.mjs

  demo:surface:
    desc: Interactive headed Bellweather surface demo; every submitted action may incur Gemini charges
    preconditions:
      - sh: test "$SEMMACHINA_PAID_SMOKE" = "1"
        msg: "Paid demo is disabled — set SEMMACHINA_PAID_SMOKE=1 explicitly."
      - sh: test -n "$GEMINI_API_KEY"
        msg: "GEMINI_API_KEY is empty — copy .env.example to .env and fill it in, or export it."
    cmds:
      - exec node web/tests/run-bellweather-surface.mjs --demo

  smoke:surface:preflight:
    desc: Action-free real-stack browser preflight; never invokes a model provider
    cmds:
      - exec node web/tests/run-bellweather-surface.mjs --preflight
